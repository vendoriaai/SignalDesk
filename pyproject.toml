[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signaldesk"
version = "1.0.0"
description = "Open-source AI market research & signal agent — headless core (M1)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SignalDesk contributors" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pydantic>=2.6",
    "httpx>=0.27",
    "typer>=0.12",
    "yfinance>=0.2.50",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "keyring>=25",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
search = ["ddgs>=6.0"]
llm = ["litellm>=1.50"]
desktop = ["pywebview>=5"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
signaldesk = "signaldesk.cli:app"

[tool.setuptools.packages.find]
include = ["signaldesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
